<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff5fb" />
<title>Moon × Venus — The Question I Was Actually Asking</title>
<style>
:root{--pink:#ff6fae;--hot:#ff3f8e;--rose:#e94f92;--peach:#ffb58f;--cream:#fffaf6;--ink:#35233a;--muted:#856f82;--lav:#cbb9ff;--mint:#bfeee0;--shadow:0 24px 70px rgba(92,35,77,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#fff5fb}body{overflow-x:hidden}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:4px solid rgba(255,63,142,.35);outline-offset:4px}.app{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,#fff 0 8%,transparent 28%),linear-gradient(145deg,#fff8fc,#fff0f7 48%,#fff8f1)}
.blob{position:fixed;border-radius:50%;filter:blur(4px);opacity:.6;pointer-events:none;z-index:0}.b1{width:35vw;height:35vw;background:#ffd2e7;left:-12vw;top:-12vw}.b2{width:30vw;height:30vw;background:#e6dbff;right:-10vw;top:20vh}.b3{width:28vw;height:28vw;background:#ffe1bc;left:25vw;bottom:-15vw}.grain{position:fixed;inset:0;pointer-events:none;opacity:.08;z-index:2;background-image:radial-gradient(#7c5473 1px,transparent 1px);background-size:17px 17px;mix-blend-mode:multiply}
.screen{position:relative;z-index:3;min-height:100vh;display:grid;place-items:center;padding:24px;opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s ease}.screen.on{opacity:1;transform:none}.shell{width:min(920px,100%);min-height:min(780px,calc(100vh - 48px));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(24px,5vw,64px);position:relative}.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:800;margin-bottom:14px}.title{font-family:Georgia,serif;font-size:clamp(2.5rem,8vw,6.5rem);line-height:.95;margin:0 0 18px;letter-spacing:-.06em}.subtitle{max-width:650px;font-size:clamp(1rem,2.3vw,1.35rem);line-height:1.65;color:var(--muted)}.type{min-height:1.5em}.cursor{display:inline-block;width:2px;height:1em;background:var(--hot);vertical-align:-.1em;animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}.btn{border:0;border-radius:999px;padding:15px 24px;min-height:54px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--hot),#ff79b6);box-shadow:0 14px 28px rgba(255,63,142,.22);font-weight:800;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 18px 35px rgba(255,63,142,.28);filter:saturate(1.08)}.btn:active{transform:translateY(1px) scale(.98)}.btn.alt{background:#fff;color:var(--rose);border:2px solid #ffd0e3;box-shadow:0 10px 22px rgba(92,35,77,.08)}.btn.soft{background:#fff8fc;color:var(--ink);border:2px dashed #f4a8c9;box-shadow:none}.btn.dark{background:var(--ink)}
.progress{position:fixed;top:0;left:0;height:5px;background:linear-gradient(90deg,var(--pink),var(--peach),var(--lav));width:0;z-index:20;transition:width .5s ease}.topbar{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:21;pointer-events:none;gap:8px}.topbar-right{display:flex;gap:8px;pointer-events:auto}.pill{pointer-events:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);padding:9px 13px;border-radius:999px;font-size:.8rem;color:var(--muted);box-shadow:0 8px 25px rgba(92,35,77,.08);text-decoration:none}.audio{cursor:pointer;border:0}.audio.off{opacity:.55}
.loading{background:linear-gradient(135deg,#fff5fb,#ffe8f3 50%,#fff3e7)}.loader-card{width:min(700px,100%);padding:clamp(28px,6vw,70px);border-radius:42px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);position:relative;overflow:hidden}.loader-card:before{content:"";position:absolute;width:220px;height:220px;background:#ffd0e6;border-radius:50%;right:-90px;top:-100px}.moon-doodle{font-size:5rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 12px 20px rgba(255,63,142,.18))}@keyframes float{50%{transform:translateY(-10px) rotate(5deg)}}.loadingline{height:10px;background:#ffe1ee;border-radius:999px;overflow:hidden;margin:25px auto 12px;max-width:500px}.loadingfill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--peach));border-radius:inherit;transition:width .3s ease}.loadhint{font-size:.85rem;color:var(--muted);min-height:1.3em}
.card{width:min(820px,100%);background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:38px;padding:clamp(24px,5vw,58px);box-shadow:var(--shadow);position:relative}.card:after{content:"";position:absolute;inset:10px;border:1px dashed #ffd2e5;border-radius:30px;pointer-events:none}.qnum{font-size:.8rem;font-weight:900;letter-spacing:.15em;color:var(--rose);text-transform:uppercase}.q{font-family:Georgia,serif;font-size:clamp(2rem,6vw,4.5rem);line-height:1.02;margin:14px auto;max-width:760px;letter-spacing:-.04em}.hint{color:var(--muted);font-size:1rem}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px;position:relative;z-index:2}.answer{min-height:74px;border:2px solid #ffd6e7;background:#fff;border-radius:24px;padding:16px;cursor:pointer;font-weight:800;color:var(--ink);transition:.2s;box-shadow:0 9px 22px rgba(92,35,77,.06)}.answer:hover{transform:translateY(-4px) rotate(-.5deg);border-color:#ff8fbd;background:#fff7fb}.answer.selected{background:#fff0f7;border-color:var(--hot);transform:scale(1.02)}.reaction{min-height:52px;margin-top:18px;color:var(--rose);font-weight:800;font-size:1.05rem}.next{margin-top:16px}
.scene{min-height:420px;display:grid;place-items:center;margin:22px 0}.court{width:min(600px,90vw);aspect-ratio:16/9;border-radius:30px;background:linear-gradient(180deg,#ffd9e9,#fff1e7);position:relative;overflow:hidden;box-shadow:inset 0 -30px 60px rgba(255,111,174,.12),0 20px 45px rgba(92,35,77,.12);border:5px solid #fff}.court:before,.court:after{content:"";position:absolute;background:rgba(255,255,255,.8)}.court:before{width:6px;height:100%;left:50%;top:0}.court:after{height:6px;width:100%;left:0;top:50%}.net{position:absolute;left:0;right:0;top:49%;height:12px;background:#fff;border-top:2px solid #d89abb;border-bottom:2px solid #d89abb}.shuttle{position:absolute;font-size:3rem;left:18%;top:25%;cursor:pointer;touch-action:none;animation:shuttle 2.4s ease-in-out infinite;z-index:3;user-select:none}@keyframes shuttle{50%{left:70%;top:62%;transform:rotate(160deg)}100%{left:18%;top:25%;transform:rotate(320deg)}}.court.hit .shuttle{animation:none;transform:translate(40px,-70px) rotate(40deg);transition:.3s}
.notebook{width:min(700px,92vw);background:#fffdf8;border-radius:26px;padding:30px;box-shadow:0 20px 50px rgba(92,35,77,.12);border:1px solid #f3dfd2;transform:rotate(-1deg)}.lines{background:repeating-linear-gradient(#fffdf8 0 35px,#e7d8ef 36px 37px);padding:18px;border-radius:14px}.choicebig{font-size:clamp(3rem,12vw,7rem);font-family:Georgia,serif;border:0;background:transparent;color:var(--rose);cursor:pointer;padding:18px;transition:.2s}.choicebig:hover{transform:scale(1.08) rotate(-3deg)}
.rapid{display:flex;flex-direction:column;gap:16px;align-items:center}.timer{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#fff;border:8px solid #ffd4e6;color:var(--rose);font-weight:900}.object-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:24px}.memory-object{width:125px;height:110px;border-radius:24px;background:#fff;border:2px solid #ffd6e7;display:grid;place-items:center;font-weight:900;cursor:pointer;transition:.2s;box-shadow:0 10px 20px rgba(92,35,77,.06)}.memory-object:hover{transform:translateY(-5px)}.memory-object.done{background:#fff0f7;border-color:var(--hot)}
.dramatic{background:linear-gradient(145deg,#fff7fb,#f6efff)}.quote{font-family:Georgia,serif;font-size:clamp(1.7rem,5vw,3.8rem);line-height:1.18;max-width:760px}.small{font-size:.9rem;color:var(--muted)}.proposal{background:radial-gradient(circle at 50% 35%,#fff 0 10%,#ffe7f2 35%,#fff1e8 72%)}.proposal .card{background:rgba(255,255,255,.88)}.yes{background:linear-gradient(135deg,#ff4f9a,#ff8dba);font-size:1.25rem;padding:18px 40px}.no{background:#fff;color:var(--ink);border:2px solid #eadce7;position:relative}.celebrate{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti{position:absolute;width:10px;height:18px;top:-30px;animation:fall 3.8s linear forwards;transform:rotate(15deg)}@keyframes fall{to{top:110vh;transform:translateX(var(--x)) rotate(720deg)}}.final-note{font-family:Georgia,serif;font-size:clamp(2.2rem,7vw,5.5rem);line-height:1.02}.signature{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:#fff;padding:13px 18px;border-radius:999px;box-shadow:0 15px 30px rgba(53,35,58,.2);transition:.25s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.submission-status{margin:18px auto 0;max-width:620px;padding:12px 16px;border-radius:16px;font-size:.9rem;line-height:1.5;background:rgba(255,255,255,.72);border:1px solid rgba(255,111,174,.2);color:var(--muted)}
.submission-status[data-kind="success"]{background:#ecfff7;color:#236b56}
.submission-status[data-kind="warning"]{background:#fff8e9;color:#805d1d}
@media(max-width:650px){.screen{padding:14px}.shell{min-height:calc(100vh - 28px);padding:18px 4px}.card{border-radius:28px;padding:24px 16px}.answers{grid-template-columns:1fr}.answer{min-height:64px}.title{font-size:clamp(2.6rem,15vw,5rem)}.q{font-size:clamp(2rem,11vw,3.5rem)}.loader-card{border-radius:28px}.topbar{top:10px;left:10px;right:10px}.pill{font-size:.72rem}.court{border-width:3px}.shuttle{font-size:2.4rem}.btn{width:100%;max-width:360px}.btns{width:100%}.object-row{gap:9px}.memory-object{width:calc(50% - 6px);height:90px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div>
  <div class="progress" id="progress"></div>
  <div class="topbar">
    <div class="pill" id="chapter">Preparing something suspicious...</div>
    <div class="topbar-right">
      <a href="https://andrew151704.github.io/My-Moon/" target="_blank" rel="noopener" class="pill">🌙 Live Site</a>
      <button class="pill audio" id="audioBtn" aria-label="Toggle sound">🔊 Sound on</button>
    </div>
  </div>
  <main id="root"></main>
  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
'use strict';
const root=document.getElementById('root'),progress=document.getElementById('progress'),chapter=document.getElementById('chapter'),audioBtn=document.getElementById('audioBtn'),toast=document.getElementById('toast');
const KEY='moonVenusRebuilt_v1';
let state={step:0,aiit:null,answers:{},memory:[],sound:true,started:false};

/* Web3Forms Integration */
const WEB3FORMS_KEY = "3804ac8a-fe31-42b7-acc6-efc4726c35e2";
const SUBMISSION_TIMEOUT_MS = 10000;

function collectAnswers() {
  return {
    ...state.answers,
    aiit: state.aiit || null,
    memoryOrder: state.memory || [],
    completedAt: new Date().toLocaleString(),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null
  };
}

function saveAnswer(id, answer) {
  state.answers[id] = answer;
  save();
}

async function submitAnswersToAndrew(finalChoice) {
  const rawAnswers = collectAnswers();
  const payload = {
    access_key: WEB3FORMS_KEY,
    subject: `Moon × Venus — Answer Received: ${finalChoice === 'YES' ? 'SHE SAID YES! 💕' : 'She responded'}`,
    from_name: "Moon × Venus App",
    "Final Proposal Answer": finalChoice === 'YES' ? "YES 💗" : "NO",
    "Hair Band Memory": rawAnswers["hair-band"] || "Not answered",
    "Was I Ever Enough Book": rawAnswers["was-i-ever-enough"] || "Not answered",
    "Description Page": rawAnswers["description-page"] || "Not answered",
    "Tiny Memory": rawAnswers["tiny-memory"] || "Not answered",
    "Kept Feeling": rawAnswers["choose-again"] || "Not answered",
    "Class 9 Subject Choice": rawAnswers["aiit"] || "Not answered",
    "Completed At": rawAnswers.completedAt
  };

  try {
    localStorage.setItem("moonVenusSubmissionBackupV1", JSON.stringify(payload));
  } catch (_) {}

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), SUBMISSION_TIMEOUT_MS);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload),
      signal: controller.signal
    });

    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || "Submission failed");

    return { ok: true, configured: true };
  } catch (error) {
    return { ok: false, configured: true, error: String(error) };
  } finally {
    clearTimeout(timeout);
  }
}

function showSubmissionStatus(card, message, kind="info") {
  let el = card.querySelector(".submission-status");
  if (!el) {
    el = document.createElement("div");
    el.className = "submission-status";
    card.appendChild(el);
  }
  el.dataset.kind = kind;
  el.textContent = message;
}

try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
let audioCtx=null;
function beep(freq=520,dur=.08){if(!state.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2200)}
audioBtn.onclick=()=>{state.sound=!state.sound;save();audioBtn.textContent=state.sound?'🔊 Sound on':'🔇 Sound off';if(state.sound)beep(720,.12)};
function setProgress(n){progress.style.width=Math.min(100,Math.max(0,n))+'%';chapter.textContent=n<10?'Preparing something suspicious...':n<25?'Questionable decisions':n<42?'Memory department':n<60?'Things are getting suspicious':n<78?'Okay... this is about us':n<94?'The question I was actually asking':'Moon × Venus'}
function render(html,cls=''){root.innerHTML='';const s=document.createElement('section');s.className='screen on '+cls;s.innerHTML=html;root.appendChild(s);return s}
function go(n){state.step=n;save();setProgress((n/15)*100);switch(n){case 0:loading();break;case 1:intro();break;case 2:trust();break;case 3:badminton();break;case 4:aiit();break;case 5:intimateMemories();break;case 6:rapid();break;case 7:ups();break;case 8:memory();break;case 9:suspicion();break;case 10:confession();break;case 11:actualQuestion();break;case 12:future();break;case 13:finalConfession();break;case 14:proposal();break;default:proposal();}}

function loading(){setProgress(0);const s=render(`<div class="loader-card"><div class="moon-doodle">🌙</div><div class="eyebrow">A tiny warning from Venus</div><h1 class="title" style="font-size:clamp(2.4rem,7vw,5rem)">Preparing a universe<br>for one Moon.</h1><div class="loadingline"><div class="loadingfill" id="fill"></div></div><div class="loadhint" id="hint">Warming up the suspicious machinery...</div><div class="btns" id="loadBtn" style="display:none"><button class="btn" id="start">Fine. I'm ready →</button></div></div>`,'loading');let p=0;const fill=s.querySelector('#fill'),hint=s.querySelector('#hint'),lb=s.querySelector('#loadBtn');const hints=['Warming up the suspicious machinery...','Polishing the questions...','Hiding approximately 3.7 jokes...','Checking whether Moon is curious...','Venus is pretending to be calm...','Okay. This is getting serious.'];const timer=setInterval(()=>{p+=Math.random()*16+7;if(p>=100){p=100;clearInterval(timer);fill.style.width='100%';hint.textContent='Everything is ready. Probably.';lb.style.display='flex'}else{fill.style.width=p+'%';hint.textContent=hints[Math.min(hints.length-1,Math.floor(p/20))]}},280);s.querySelector('#start').onclick=()=>{state.started=true;save();beep(760,.12);go(1)}}
function intro(){const s=render(`<div class="shell"><div class="eyebrow">Private conversation · Moon × Venus</div><h1 class="title"><span class="type"></span><span class="cursor"></span></h1><p class="subtitle" id="introSub"></p><div class="btns" id="introBtns" style="display:none"><button class="btn" id="go">Fine. Let's go →</button></div></div>`);const lines=['Okay.','I have a few questions for you.','Don’t overthink them.','Actually...','You’re probably going to overthink them.'];let i=0;const type=s.querySelector('.type'),sub=s.querySelector('#introSub');function next(){if(i<lines.length){if(i===0){type.textContent=lines[i]}else{sub.textContent=lines[i]}i++;setTimeout(next,i===1?700:900)}else{s.querySelector('#introBtns').style.display='flex'}}next();s.querySelector('#go').onclick=()=>{beep(650);go(2)}}
function questionCard(number,q,answers,reactions,nextStep,extra=''){const s=render(`<div class="shell"><div class="card"><div class="qnum">Question ${number}</div><div class="q">${q}</div><div class="hint">${extra}</div><div class="answers">${answers.map((a,i)=>`<button class="answer" data-i="${i}">${a}</button>`).join('')}</div><div class="reaction" aria-live="polite"></div><div class="next"><button class="btn" style="display:none">Okay, moving on →</button></div></div></div>`);const bs=[...s.querySelectorAll('.answer')],r=s.querySelector('.reaction'),next=s.querySelector('.next .btn');bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');saveAnswer('q'+number, answers[i]);r.textContent=reactions[i]||reactions[0];beep(450+i*100);next.style.display='inline-flex'});next.onclick=()=>{beep(700);go(nextStep)};return s}
function trust(){questionCard(1,'Do you trust me?',['Yes.','Obviously.','Why are you asking this? 🤨'],['Hmm. Interesting.','Okay, confident.','Nothing. Absolutely nothing. Moving on.'],3,'Choose carefully. Venus is taking notes.').querySelector('.next .btn').onclick=()=>go(3)}
function badminton(){const s=render(`<div class="shell"><div class="eyebrow">Memory checkpoint · 01</div><h1 class="q">Let's see how good your memory is.</h1><div class="scene"><div class="court" id="court"><div class="net"></div><div class="shuttle" id="shuttle" role="button" tabindex="0" aria-label="Tap the shuttlecock">🏸</div></div></div><p class="subtitle" id="badText">Tap the shuttlecock. It has been waiting for this moment.</p><div class="btns"><button class="btn" id="remember" style="display:none">I remember →</button></div></div>`);const sh=s.querySelector('#shuttle'),court=s.querySelector('#court'),text=s.querySelector('#badText'),btn=s.querySelector('#remember');let hits=0;const hit=()=>{hits++;court.classList.add('hit');setTimeout(()=>court.classList.remove('hit'),350);beep(500+hits*80);text.textContent=hits<3?`Again. Venus needs evidence. (${hits}/3)`:'Okay, okay. You definitely know how to hit a shuttlecock.';if(hits>=3)btn.style.display='inline-flex'};sh.onclick=hit;sh.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')hit()};court.addEventListener('pointerdown',e=>{if(e.target!==sh&&hits<3){toastMsg('The shuttlecock is the important bit 😭');}});btn.onclick=()=>go(4)}
function aiit(){const s=render(`<div class="shell"><div class="notebook"><div class="eyebrow">Memory checkpoint · 02</div><h1 class="q">Remember when you asked me...</h1><p class="subtitle">“What should I take in Class 9?”</p><div class="lines"><div class="btns"><button class="choicebig" data-v="AI">AI</button><button class="choicebig" data-v="IT">IT</button></div></div><p class="reaction" id="aiReact"></p></div></div>`);s.querySelectorAll('.choicebig').forEach(b=>b.onclick=()=>{state.aiit=b.dataset.v;saveAnswer('aiit', b.dataset.v);beep(b.dataset.v==='AI'?780:620);s.querySelector('#aiReact').textContent=`${b.dataset.v}? Interesting. Very important information. Definitely not going to use this later.`;setTimeout(()=>go(5),1600)})}

function intimateMemories(){
  const qs = [
    { id:"hair-band", q:"Do you remember the hair band you gave me?", a:["Of course I do. 💗","Wait... you still remember that?","I need a second. That one is oddly specific."] },
    { id:"was-i-ever-enough", q:"Do you remember reading *Was I Ever Enough* together?", a:["Yes. I remember.","How could I forget?","That one felt different."] },
    { id:"description-page", q:"Do you still have the description page I made for you?", a:["Yes.","I remember it.","You actually remember that?"] },
    { id:"tiny-memory", q:"What's one tiny thing about us you think I remember even when you don't expect me to?", a:["Something silly.","Something only we'd understand.","Something you think I forgot."] },
    { id:"choose-again", q:"If you could keep one feeling from everything we've been through, which would you keep?", a:["The laughter.","The comfort.","The feeling of finding our way back."] }
  ];
  let i=0;
  const reactions=[
    ["I knew that one would make you pause. 😭","Some memories are tiny. Somehow they stay.","Okay, moving on before Venus gets emotional."],
    ["Yeah. That memory stayed with me too.","Funny how a book can become part of a story that isn't written in it.","Okay. That was supposed to be simple. Why is it suddenly emotional?"],
    ["I remember. More than you probably realise.","Apparently I kept more memories than I admitted.","Of course I remember. You really thought I wouldn't?"],
    ["Exactly. The tiny things are usually the dangerous ones.","That's the kind of answer I was hoping for.","Maybe I remember more than I let on."],
    ["Yeah. I think I'd keep that too.","Some feelings are worth holding onto.","Maybe that's the whole point of this little interrogation."]
  ];
  const s=render(`<div class="shell"><div class="card"><div class="qnum">Memory checkpoint · 03</div><div class="q" id="imQ"></div><div class="hint">No right answer. Just answer honestly.</div><div class="answers" id="imA"></div><div class="reaction" id="imR" aria-live="polite"></div><div class="next"><button class="btn" id="imNext" style="display:none">Okay... next memory →</button></div></div></div>`);
  const q=s.querySelector('#imQ'),a=s.querySelector('#imA'),r=s.querySelector('#imR'),next=s.querySelector('#imNext');
  function show(){
    const x=qs[i]; q.textContent=x.q;
    a.innerHTML=x.a.map((v,j)=>`<button class="answer" data-i="${j}">${v}</button>`).join('');
    r.textContent=''; next.style.display='none';
    a.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{
      const choice=x.a[+b.dataset.i];
      saveAnswer(x.id,choice);
      r.textContent=reactions[i][+b.dataset.i];
      next.style.display='inline-flex';
      beep(540+i*70,.08);
    });
  }
  next.onclick=()=>{i++; if(i<qs.length)show(); else go(6)};
  show();
}

const rapidQs=[['Who is more dramatic?',['Me.','You.','Both.'],['Correct answer.','Excuse me? 😭','Honestly, fair.']],['Who is more stubborn?',['Me.','You.','This question is dangerous.'],['Bold.','No comment.','Correct.']],['Who is more likely to start an argument over something completely unnecessary?',['Me.','You.','We both know.'],['Interesting choice.','Venus has entered the chat.','Exactly.']],['Who gives in first?',['Me.','You.','Depends who is pretending not to care.'],['Noted.','Sure. 😂','That is suspiciously specific.']]];
function rapid(){let idx=0;const s=render(`<div class="shell"><div class="eyebrow">Rapid-fire round</div><div class="timer">4</div><h1 class="q" id="rq"></h1><div class="answers" id="ra"></div><div class="reaction" id="rr"></div></div>`);const q=s.querySelector('#rq'),a=s.querySelector('#ra'),r=s.querySelector('#rr'),timer=s.querySelector('.timer');function show(){const x=rapidQs[idx];q.textContent=x[0];a.innerHTML=x[1].map((v,i)=>`<button class="answer" data-i="${i}">${v}</button>`).join('');let t=4;timer.textContent=t;clearInterval(show.t);show.t=setInterval(()=>{t--;timer.textContent=t;if(t<=0){clearInterval(show.t);r.textContent='Venus will pretend that answer was acceptable.'}},1000);a.querySelectorAll('.answer').forEach((b,i)=>b.onclick=()=>{clearInterval(show.t);saveAnswer('rapid'+idx, x[1][i]);r.textContent=x[2][i];beep(520+i*90);setTimeout(()=>{idx++;if(idx<rapidQs.length)show();else go(7)},700)})}show()}
function ups(){questionCard(5,'Remember all those times we fought?',['Simple.','Complicated.','Chaotic.','Somehow, still us.'],['That is a very optimistic answer.','Yeah. Complicated is probably fair.','Honestly? Fair. 😂','Yeah. That one feels right.'],8,'There were difficult moments. Times when we came close to going our separate ways. But somehow... we kept finding our way back.').querySelector('.next .btn').onclick=()=>go(8)}
function memory(){const order=['BADMINTON',state.aiit||'AI / IT','UPS & DOWNS','COMING BACK'];let pos=0;const s=render(`<div class="shell"><div class="eyebrow">Memory check</div><h1 class="q">Okay. Enough emotional damage.</h1><p class="subtitle">Tap the moments in the order they happened.</p><div class="object-row">${order.map((x,i)=>`<button class="memory-object" data-i="${i}">${x}</button>`).join('')}</div><p class="reaction" id="mr">Start anywhere. Venus is not judging.</p></div>`);const bs=[...s.querySelectorAll('.memory-object')],r=s.querySelector('#mr');bs.forEach((b,i)=>b.onclick=()=>{if(i===pos){b.classList.add('done');pos++;beep(550+pos*70);r.textContent=pos<order.length?'Okay. Keep going.':'Look at that. You actually remember.';if(pos===order.length)setTimeout(()=>go(9),1000)}else{r.textContent='Hmm. Nice try. Let’s follow the actual timeline. 😭';beep(250)}})}
function suspicion(){questionCard(6,'Wait. I think you’re starting to figure this out.',['Figure what out?','I already know.','Venus, just say it.'],['Nothing. Absolutely nothing.','Oh. So you’re THAT confident?','Wow. No patience.'],10,'One more question. Probably. Maybe.').querySelector('.next .btn').onclick=()=>go(10)}
function confession(){const s=render(`<div class="shell"><div class="card"><div class="eyebrow">Okay. No jokes for a second.</div><div class="quote" id="conf"></div><div class="btns" id="cb" style="display:none"><button class="btn" id="continue">I’m listening.</button></div></div></div>`,'dramatic');const lines=['I’ve been calling you Moon.','And you call me Venus.','At first, it sounds like a cute nickname.','But I don’t think that’s why it stuck.','I think I call you Moon because...','no matter how chaotic everything gets...','somehow...','I keep finding my way back to you.','Even after the fights.','Even after the difficult moments.','Even after the times we almost went our separate ways.','We came back.','Again.','And again.','Maybe that’s what makes this ours.'];let i=0;const el=s.querySelector('#conf');function next(){if(i<lines.length){el.textContent=lines[i++];setTimeout(next,i===5?1000:650)}else s.querySelector('#cb').style.display='flex'}next();s.querySelector('#continue').onclick=()=>go(11)}
function actualQuestion(){questionCard(7,'Do you know what all these questions were actually about?',['Us.','Me.','You.'],['Exactly.','Close.','You’re not wrong.'],12,'The badminton question. The AI or IT question. The questions about the difficult moments. All of it.').querySelector('.next .btn').onclick=()=>go(12)}
function future(){questionCard(8,'Do you think two people can go through the arguments, misunderstandings, almost-goodbyes... and still choose each other?',['Yes.','Sometimes.','Depends on the people.'],['Yeah. I think so too.','Sometimes is honest.','That’s exactly the point.'],13,'Because I don’t think love means everything is always easy.').querySelector('.next .btn').onclick=()=>go(13)}
function finalConfession(){const s=render(`<div class="shell"><div class="card"><div class="eyebrow">The question I was actually asking</div><div class="quote" id="fc"></div><div class="btns" id="fb" style="display:none"><button class="btn" id="ask">Ask me.</button></div></div></div>`,'dramatic');const choice=state.aiit?`The Moon chose ${state.aiit} that day. I remembered.`:'';const lines=['Yeah.','I think love means that when things get hard...','you still have a reason to stay.','And I know what my reason is.',choice,'Shailee.','I’m Andrew.','Your Venus.','And you’re my Moon.','I don’t know what the future will look like.','I don’t know how many more arguments we’ll have.','I don’t know how many ridiculous moments are still waiting for us.','But I know this.','I don’t want to stop choosing you.','And I don’t want this to be just another chapter.','So... can I ask you something?'];let i=0;const el=s.querySelector('#fc');function next(){if(i<lines.length){el.textContent=lines[i++];setTimeout(next,700)}else s.querySelector('#fb').style.display='flex'}next();s.querySelector('#ask').onclick=()=>go(14)}

function proposal(){
  const s=render(`<div class="shell"><div class="card"><div class="eyebrow">One last question</div><div class="quote">Will you choose me?<br><span class="small">Through the easy days. Through the difficult ones. Through the chaos. Through everything.</span></div><p class="subtitle">Will you let Venus stay in your orbit?</p><div class="btns"><button class="btn yes" id="yes">YES 💗</button><button class="btn no" id="no">NO</button></div><p class="reaction" id="nr"></p></div></div>`,'proposal');
  const no=s.querySelector('#no'),yes=s.querySelector('#yes'),nr=s.querySelector('#nr');
  let noCount=0;
  function moveNo(){
    noCount++;
    if(noCount<=4){
      nr.textContent=['Are you sure? 👀','Wait.','You’re actually serious?','Okay, okay...'][noCount-1];
      no.style.position='fixed';
      const pad=18, maxX=Math.max(pad,innerWidth-no.offsetWidth-pad), maxY=Math.max(pad,innerHeight-no.offsetHeight-pad);
      no.style.left=(pad+Math.random()*(maxX-pad))+'px';
      no.style.top=(pad+Math.random()*(maxY-pad))+'px';
      no.style.zIndex=9999;
    }else{
      no.style.position='static';no.style.left='';no.style.top='';no.style.zIndex='';
      nr.textContent='Fine. I really mean it. You can say no.';
      no.textContent='I really mean No';
      no.onclick=()=>noEnding();
    }
  }
  no.addEventListener('pointerenter',()=>{if(noCount<4)moveNo()},{passive:true});
  no.addEventListener('pointerdown',(e)=>{if(noCount<4){e.preventDefault();moveNo()}},{passive:false});
  yes.onclick=()=>yesEnding();
}

async function noEnding(){
  const s=render(`<div class="shell"><div class="card"><div class="eyebrow">Moon × Venus</div><div class="final-note">That’s okay, Moon.</div><p class="subtitle">Really. Thank you for being honest with me.<br><br>Venus respects your choice.<br><br>Whatever happens next, I’m glad I got to share this little universe with you.</p><div class="signature">— Andrew</div><div class="submission-status" id="submitStatus">Sending your answers to Andrew...</div><div class="btns"><button class="btn alt" onclick="location.reload()">Replay the story</button><a href="https://andrew151704.github.io/My-Moon/" target="_blank" rel="noopener" class="btn alt">Visit Live Page 🌙</a></div></div></div>`);
  const result=await submitAnswersToAndrew('NO');
  if(result.ok) showSubmissionStatus(s.querySelector('.card'),'✓ Your answers were sent directly to Andrew.','success');
  else showSubmissionStatus(s.querySelector('.card'),'⚠️ Answers saved on device, but couldn\'t send via email.','warning');
  state.step=14;save();setProgress(100);chapter.textContent='Thank you for being here.';
}

async function yesEnding(){
  beep(900,.2);state.step=15;save();setProgress(100);chapter.textContent='Moon × Venus';
  const s=render(`<div class="shell"><div class="card"><div class="eyebrow">Okay. So this happened.</div><div class="final-note" id="fin"></div><p class="subtitle" id="finSub"></p><div class="signature">MOON × VENUS</div><div class="submission-status" id="submitStatus">Sending your answers to Andrew...</div><div class="btns"><button class="btn alt" onclick="location.reload()">Replay the chaos ↺</button><a href="https://andrew151704.github.io/My-Moon/" target="_blank" rel="noopener" class="btn alt">Visit Live Page 🌙</a></div></div></div>`,'proposal');
  const lines=['Different people.','Different moments.','One choice.','One story.','One orbit.'];
  let i=0;
  const fin=s.querySelector('#fin'),sub=s.querySelector('#finSub');
  function next(){if(i<lines.length){fin.textContent=lines[i++];setTimeout(next,850)}else{sub.innerHTML='Good.<br>Because I had absolutely no backup plan.<br><br><strong>Okay...</strong><br>Maybe I did.';confetti()}}next();

  const result=await submitAnswersToAndrew('YES');
  if(result.ok) showSubmissionStatus(s.querySelector('.card'),'✓ Your answers were sent directly to Andrew! 💕','success');
  else showSubmissionStatus(s.querySelector('.card'),'⚠️ Answers saved on device, but couldn\'t send via email.','warning');
}

function confetti(){const c=document.createElement('div');c.className='celebrate';for(let i=0;i<90;i++){const x=document.createElement('i');x.className='confetti';x.style.left=Math.random()*100+'%';x.style.background=['#ff4f9a','#ffb58f','#cbb9ff','#ffd45e','#bfeee0'][Math.floor(Math.random()*5)];x.style.setProperty('--x',(Math.random()*240-120)+'px');x.style.animationDelay=(Math.random()*1.4)+'s';c.appendChild(x)}document.body.appendChild(c);setTimeout(()=>c.remove(),6000)}

setProgress(0);
loading();
})();
