<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff5fb" />
<title>Moon × Venus — The Question I Was Actually Asking</title>
<style>
:root{--pink:#ff6fae;--hot:#ff3f8e;--rose:#e94f92;--peach:#ffb58f;--cream:#fffaf6;--ink:#35233a;--muted:#856f82;--lav:#cbb9ff;--mint:#bfeee0;--shadow:0 24px 70px rgba(92,35,77,.16)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#fff5fb;overflow-x:hidden;width:100%;position:relative}
button{font:inherit}
button:focus-visible{outline:4px solid rgba(255,63,142,.35);outline-offset:4px}
.app{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,#fff 0 8%,transparent 28%),linear-gradient(145deg,#fff8fc,#fff0f7 48%,#fff8f1)}
.blob{position:fixed;border-radius:50%;filter:blur(4px);opacity:.6;pointer-events:none;z-index:0}
.b1{width:35vw;height:35vw;background:#ffd2e7;left:-12vw;top:-12vw}
.b2{width:30vw;height:30vw;background:#e6dbff;right:-10vw;top:20vh}
.b3{width:28vw;height:28vw;background:#ffe1bc;left:25vw;bottom:-15vw}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.08;z-index:2;background-image:radial-gradient(#7c5473 1px,transparent 1px);background-size:17px 17px;mix-blend-mode:multiply}

/* Floating Emojis Background (Drift) */
.driftwrap{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.drift{position:absolute;bottom:-10vh;opacity:0;font-size:1.2rem;animation:driftup linear infinite;color:var(--hot)}
@keyframes driftup{
  0%{opacity:0;transform:translateY(0) rotate(0deg)}
  8%{opacity:.35}
  92%{opacity:.25}
  100%{opacity:0;transform:translateY(-115vh) rotate(25deg)}
}

/* Dreamy Floating Fireflies */
.firefly {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  animation: floatFly 14s infinite linear;
}
@keyframes floatFly {
  0% { transform: translateY(105vh) translateX(0) scale(0.8); opacity: 0; }
  20% { opacity: 0.7; }
  80% { opacity: 0.5; }
  100% { transform: translateY(-10vh) translateX(100px) scale(0.3); opacity: 0; }
}

/* Cursor Sparkle Trail */
.cursor-sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 99999;
  animation: sparkleFade 0.85s forwards ease-out;
  font-size: 18px;
  user-select: none;
  text-shadow: 0 0 6px rgba(255,255,255,0.9);
}
@keyframes sparkleFade {
  0% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, calc(-50% + 40px)) scale(0.2) rotate(45deg); opacity: 0; }
}

.screen{position:relative;z-index:3;min-height:100vh;display:grid;place-items:center;padding:24px;opacity:0;transform:translateY(12px);transition:opacity .65s ease,transform .65s ease}
.screen.on{opacity:1;transform:none}
.shell{width:min(920px,100%);min-height:min(780px,calc(100vh - 48px));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(24px,5vw,64px);position:relative}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:800;margin-bottom:14px}
.title{font-family:Georgia,serif;font-size:clamp(2.3rem,7.5vw,6rem);line-height:1.05;margin:0 0 18px;letter-spacing:-.04em}
.subtitle{max-width:650px;font-size:clamp(1.05rem,2.4vw,1.38rem);line-height:1.75;color:var(--muted)}
.type{min-height:1.5em; display:inline-block;}
.cursor{display:inline-block;width:3px;height:1em;background:var(--hot);vertical-align:-.1em;animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:28px;width:100%;max-width:420px}
.btn{border:0;border-radius:999px;padding:16px 28px;min-height:56px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--hot),#ff79b6);box-shadow:0 14px 28px rgba(255,63,142,.22);font-weight:800;font-size:1.05rem;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;touch-action:manipulation;width:100%}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 18px 35px rgba(255,63,142,.32);filter:saturate(1.1)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.alt{background:#fff;color:var(--rose);border:2px solid #ffd0e3;box-shadow:0 10px 22px rgba(92,35,77,.08)}
.btn.soft{background:#fff8fc;color:var(--ink);border:2px dashed #f4a8c9;box-shadow:none}

/* YES Heartbeat Button */
.btn.yes {
  animation: heartbeat 2.2s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
  background: linear-gradient(135deg, #ff3f8e, #ff70af);
  font-size: 1.3rem;
  padding: 18px 42px;
}
@keyframes heartbeat {
  0% { transform: scale(1); }
  14% { transform: scale(1.06); box-shadow: 0 18px 38px rgba(255,63,142,0.45); }
  28% { transform: scale(1); }
  42% { transform: scale(1.06); box-shadow: 0 18px 38px rgba(255,63,142,0.45); }
  70% { transform: scale(1); }
  100% { transform: scale(1); }
}

.btn.no { background:#fff; color:var(--ink); border:2px solid #eadce7; position:relative; }

.progress{position:fixed;top:0;left:0;height:5px;background:linear-gradient(90deg,var(--pink),var(--peach),var(--lav));width:0;z-index:20;transition:width .5s ease}
.topbar{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:21;pointer-events:none}
.pill{pointer-events:auto;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);padding:9px 15px;border-radius:999px;font-size:.82rem;color:var(--muted);box-shadow:0 8px 25px rgba(92,35,77,.08);font-weight:700}
.audio{cursor:pointer;border:0}

.loading{background:linear-gradient(135deg,#fff5fb,#ffe8f3 50%,#fff3e7)}
.loader-card{width:min(700px,100%);padding:clamp(28px,6vw,70px);border-radius:42px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center}
.loader-card:before{content:"";position:absolute;width:220px;height:220px;background:#ffd0e6;border-radius:50%;right:-90px;top:-100px;opacity:.6}
.moon-doodle{font-size:4.8rem;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 20px rgba(255,63,142,.18));user-select:none;}
@keyframes float{50%{transform:translateY(-10px) rotate(6deg)}}
.loadingline{height:10px;background:#ffe1ee;border-radius:999px;overflow:hidden;margin:25px auto 12px;max-width:500px}
.loadingfill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--peach));border-radius:inherit;transition:width .3s ease}
.loadhint{font-size:.9rem;color:var(--muted);min-height:1.4em;font-weight:600}

.card{width:min(820px,100%);background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:38px;padding:clamp(24px,5vw,58px);box-shadow:var(--shadow);position:relative}
.card:after{content:"";position:absolute;inset:10px;border:1px dashed #ffd2e5;border-radius:30px;pointer-events:none}
.qnum{font-size:.8rem;font-weight:900;letter-spacing:.15em;color:var(--rose);text-transform:uppercase}
.q{font-family:Georgia,serif;font-size:clamp(1.9rem,5.5vw,4.2rem);line-height:1.2;margin:14px auto;max-width:760px;letter-spacing:-.03em}
.hint{color:var(--muted);font-size:1.02rem;line-height:1.6;margin-top:8px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px;position:relative;z-index:2}
.answer{min-height:70px;border:2px solid #ffd6e7;background:#fff;border-radius:22px;padding:16px;cursor:pointer;font-weight:800;font-size:1.02rem;color:var(--ink);transition:all .22s cubic-bezier(0.175, 0.885, 0.32, 1.275);box-shadow:0 9px 22px rgba(92,35,77,.06);touch-action:manipulation}
.answer:hover{transform:translateY(-4px) scale(1.015);border-color:#ff8fbd;background:#fff7fb;box-shadow:0 14px 28px rgba(255,63,142,.15)}
.answer.selected{background:#fff0f7;border-color:var(--hot);transform:scale(1.02)}
.reaction{min-height:52px;margin-top:20px;color:var(--rose);font-weight:800;font-size:1.1rem;line-height:1.5}
.next{margin-top:16px;display:flex;justify-content:center}

.notebook{width:min(700px,92vw);background:#fffdf8;border-radius:28px;padding:32px;box-shadow:0 20px 50px rgba(92,35,77,.12);border:1px solid #f3dfd2;transform:rotate(-0.8deg);margin:0 auto}
.lines{background:repeating-linear-gradient(#fffdf8 0 35px,#e7d8ef 36px 37px);padding:22px;border-radius:16px;margin-top:16px}
.choicebig{font-size:clamp(3.2rem,11vw,6.5rem);font-family:Georgia,serif;border:0;background:transparent;color:var(--rose);cursor:pointer;padding:18px 28px;transition:.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);font-weight:bold}
.choicebig:hover{transform:scale(1.15) rotate(-3deg);color:var(--hot)}

.timer{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#fff;border:7px solid #ffd4e6;color:var(--rose);font-size:1.8rem;font-weight:900;margin:0 auto 16px}
.object-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.memory-object{width:135px;height:110px;border-radius:24px;background:#fff;border:2px solid #ffd6e7;display:grid;place-items:center;font-weight:900;font-size:.95rem;cursor:pointer;transition:all .22s ease;box-shadow:0 10px 20px rgba(92,35,77,.06);padding:10px;text-align:center}
.memory-object:hover{transform:translateY(-5px) scale(1.03);border-color:var(--hot)}
.memory-object.done{background:#fff0f7;border-color:var(--hot);color:var(--hot);transform:scale(1.02)}

.dramatic{background:linear-gradient(145deg,#fff7fb,#f6efff)}
.quote{font-family:Georgia,serif;font-size:clamp(1.75rem,4.8vw,3.6rem);line-height:1.35;max-width:760px;margin:0 auto;color:var(--ink)}
.small{font-size:.95rem;color:var(--muted);display:block;margin-top:10px}
.proposal{background:radial-gradient(circle at 50% 35%,#fff 0 10%,#ffe7f2 35%,#fff1e8 72%)}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti{position:absolute;top:-30px;animation:fall 3.8s linear forwards}
@keyframes fall{to{top:110vh;transform:translateX(var(--x)) rotate(720deg)}}
.final-note{font-family:Georgia,serif;font-size:clamp(2.2rem,6.5vw,5.2rem);line-height:1.15;color:var(--ink)}
.signature{font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin-top:22px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;box-shadow:0 15px 30px rgba(53,35,58,.25);transition:.25s;max-width:90vw;text-align:center;font-weight:700;font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

.glowing-ending {
  animation: pulseGlow 2.5s infinite alternate;
}
@keyframes pulseGlow {
  0% { text-shadow: 0 0 10px rgba(255, 111, 174, 0.4); transform: scale(1); }
  100% { text-shadow: 0 0 25px rgba(255, 111, 174, 0.8), 0 0 40px rgba(255, 63, 142, 0.5); transform: scale(1.02); }
}

.submission-status{
  margin:22px auto 0;max-width:620px;padding:12px 18px;border-radius:18px;
  font-size:.9rem;line-height:1.5;background:rgba(255,255,255,.85);
  border:1px solid rgba(255,111,174,.3);color:var(--muted);font-weight:600
}
.submission-status[data-kind="success"]{background:#ecfff7;color:#1d634f;border-color:#a2edd5}
.submission-status[data-kind="warning"]{background:#fff8e9;color:#7a5818;border-color:#fce4a6}

@media(max-width:650px){
  .screen{padding:14px}
  .shell{min-height:calc(100vh - 28px);padding:20px 8px}
  .card{border-radius:28px;padding:26px 18px}
  .answers{grid-template-columns:1fr;gap:12px}
  .answer{min-height:62px;font-size:1rem}
  .title{font-size:clamp(2.4rem,13vw,4.5rem)}
  .q{font-size:clamp(1.8rem,9vw,3.2rem)}
  .btn{width:100%;max-width:100%}
  .btns{width:100%;max-width:100%}
  .object-row{gap:10px}
  .memory-object{width:calc(50% - 6px);height:95px}
  .topbar{top:12px;left:12px;right:12px}
  .pill{font-size:.75rem;padding:8px 12px}
}

/* Grand YES & NO Endings Styling */
.glowing-card {
  box-shadow: 0 0 50px rgba(255, 63, 142, 0.35), 0 20px 60px rgba(92, 35, 77, 0.18) !important;
  border: 2px solid rgba(255, 111, 174, 0.6) !important;
  animation: floatCard 4s ease-in-out infinite alternate;
}
@keyframes floatCard {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-8px); }
}

.love-badge {
  display: inline-block;
  background: linear-gradient(135deg, #ff3f8e, #ff79b6);
  color: white;
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 1.05rem;
  box-shadow: 0 12px 28px rgba(255, 63, 142, 0.45);
  letter-spacing: 0.03em;
  animation: pulseGlow 2s infinite alternate;
}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grain"></div>
  <div class="driftwrap" id="driftwrap" aria-hidden="true"></div>
  <div class="progress" id="progress"></div>
  <div class="topbar">
    <div class="pill" id="chapter">Preparing something suspicious...</div>
    <button class="pill audio" id="audioBtn" aria-label="Toggle sound">🔊 Sound on</button>
  </div>
  <main id="root"></main>
  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
'use strict';

const driftwrap = document.getElementById('driftwrap');

// ✨ Floating Ambient Emojis
(function seedDrift(){
  if(!driftwrap) return;
  const glyphs=['💗','✨','💫','🌙','🤍'];
  for(let i=0;i<15;i++){
    const el=document.createElement('span');
    el.className='drift';
    el.textContent=glyphs[i%glyphs.length];
    el.style.left=(Math.random()*96)+'vw';
    el.style.fontSize=(0.9+Math.random()*1.1)+'rem';
    el.style.animationDuration=(14+Math.random()*12)+'s';
    el.style.animationDelay=(Math.random()*14)+'s';
    driftwrap.appendChild(el);
  }
})();

// 💖 Magical Mouse & Touch Sparkle Trail
let lastSparkle = 0;
document.addEventListener('pointermove', (e) => {
  let now = Date.now();
  if (now - lastSparkle < 45) return;
  lastSparkle = now;
  let s = document.createElement('div');
  s.className = 'cursor-sparkle';
  s.textContent = ['✨', '💖', '🌸', '🤍', '💫'][Math.floor(Math.random()*5)];
  s.style.left = e.clientX + 'px';
  s.style.top = e.clientY + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 850);
});

// ✨ Floating Dream Fireflies
function createDreamscape() {
  const container = document.createElement('div');
  container.style.position = 'fixed'; 
  container.style.inset = '0'; 
  container.style.pointerEvents = 'none'; 
  container.style.overflow = 'hidden'; 
  container.style.zIndex = '1';
  for(let i=0; i<25; i++) {
    let f = document.createElement('div'); 
    f.className = 'firefly';
    f.style.left = Math.random()*100 + 'vw';
    f.style.animationDuration = (Math.random()*10 + 10) + 's';
    f.style.animationDelay = '-' + (Math.random()*15) + 's';
    f.style.background = ['#ff9ed2', '#ffd0e6', '#ffe1bc', '#cbb9ff', '#ffffff'][Math.floor(Math.random()*5)];
    container.appendChild(f);
  }
  document.body.appendChild(container);
}
createDreamscape();

const root=document.getElementById('root'),progress=document.getElementById('progress'),chapter=document.getElementById('chapter'),audioBtn=document.getElementById('audioBtn'),toast=document.getElementById('toast');
const KEY='moonVenusRebuilt_v2';
let state={step:0,aiit:null,answers:{},memory:[],sound:true,started:false};

/*
  ===================================================================
  💌 RECEIVING EVERY SINGLE ANSWER VIA WEB3FORMS
  ===================================================================
*/
const WEB3FORMS_KEY = "3804ac8a-fe31-42b7-acc6-efc4726c35e2";
const SUBMISSION_TIMEOUT_MS = 10000;

function collectAnswers() {
  return {
    ...state.answers,
    aiit: state.aiit || null,
    memoryOrder: state.memory || [],
    completedAt: new Date().toLocaleString(),
    userAgent: navigator.userAgent,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null
  };
}

function saveAnswer(id, answer) {
  state.answers[id] = answer;
  save();
}

async function submitAnswersToAndrew(finalChoice) {
  const raw = collectAnswers();
  
  // Mapping every single tracked answer meticulously
  const payload = {
    access_key: WEB3FORMS_KEY,
    subject: `Moon × Venus — Answer Received: ${finalChoice === 'YES' ? 'SHE SAID YES! 💕' : 'She responded'}`,
    from_name: "Moon × Venus App",
    "Final Proposal Answer": finalChoice === 'YES' ? "YES 💗" : "NO",
    
    // Checkpoints & Questions mapped nicely
    "1. Trust Question": raw["q1"] || "Skipped",
    "2. Badminton Heart": raw["badminton_heart"] || "Skipped",
    "3. Class 9 Subject": raw["aiit_choice"] || "Skipped",
    "4. Hair Band Memory": raw["hair-band"] || "Skipped",
    "5. Was I Ever Enough": raw["was-i-ever-enough"] || "Skipped",
    "6. Description Page": raw["description-page"] || "Skipped",
    "7. Tiny Memory": raw["tiny-memory"] || "Skipped",
    "8. Kept Feeling": raw["choose-again"] || "Skipped",
    
    // Rapid Fire Round
    "9. Rapid: Dramatic": raw["rapid_0"] || "Skipped",
    "10. Rapid: Stubborn": raw["rapid_1"] || "Skipped",
    "11. Rapid: Argument": raw["rapid_2"] || "Skipped",
    "12. Rapid: Gives In": raw["rapid_3"] || "Skipped",
    
    // Deep Questions
    "13. Ups & Downs": raw["q5"] || "Skipped",
    "14. Suspicion": raw["q6"] || "Skipped",
    "15. Actual Question": raw["q7"] || "Skipped",
    "16. Future": raw["q8"] || "Skipped",
    
    // Metadata
    "Completed At": raw.completedAt
  };

  try {
    localStorage.setItem("moonVenusSubmissionBackupV2", JSON.stringify(payload));
  } catch (_) {}

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), SUBMISSION_TIMEOUT_MS);

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload),
      signal: controller.signal
    });

    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.message || "Submission failed");

    return { ok: true, configured: true };
  } catch (error) {
    return { ok: false, configured: true, error: String(error) };
  } finally {
    clearTimeout(timeout);
  }
}

function showSubmissionStatus(card, message, kind="info") {
  let el = card.querySelector(".submission-status");
  if (!el) {
    el = document.createElement("div");
    el.className = "submission-status";
    card.appendChild(el);
  }
  el.dataset.kind = kind;
  el.textContent = message;
}

try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
let audioCtx=null;
function beep(freq=520,dur=.08){if(!state.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function toastMsg(t){toast.textContent='💌 ' + t;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2400)}
audioBtn.onclick=()=>{state.sound=!state.sound;save();audioBtn.textContent=state.sound?'🔊 Sound on':'🔇 Sound off';if(state.sound)beep(720,.12)};

function setProgress(n){
  progress.style.width=Math.min(100,Math.max(0,n))+'%';
  chapter.textContent=n<10?'Preparing something suspicious...':n<25?'Questionable decisions':n<42?'Memory department':n<60?'Things are getting suspicious':n<78?'Okay... this is about us':n<94?'The question I was actually asking':'Moon × Venus'
}

function render(html,cls=''){root.innerHTML='';const s=document.createElement('section');s.className='screen on '+cls;s.innerHTML=html;root.appendChild(s);return s}

function go(n){
  state.step=n;save();
  setProgress((n/14)*100);
  switch(n){
    case 0:loading();break;
    case 1:intro();break;
    case 2:trust();break;
    case 3:badminton();break;
    case 4:aiit();break;
    case 5:intimateMemories();break;
    case 6:rapid();break;
    case 7:ups();break;
    case 8:memory();break;
    case 9:suspicion();break;
    case 10:confession();break;
    case 11:actualQuestion();break;
    case 12:future();break;
    case 13:finalConfession();break;
    case 14:proposal();break;
    default:proposal();
  }
}

function loading(){
  setProgress(0);

function questionCard(number,q,answers,reactions,nextStep,extra=''){
  const s=render(`<div class="shell"><div class="card"><div class="qnum">Question ${number}</div><div class="q">${q}</div><div class="hint">${extra}</div><div class="answers">${answers.map((a,i)=>`<button class="answer" data-i="${i}">${a}</button>`).join('')}</div><div class="reaction" aria-live="polite"></div><div class="next"><button class="btn" style="display:none">Okay, moving on →</button></div></div></div>`);
  const bs=[...s.querySelectorAll('.answer')],r=s.querySelector('.reaction'),next=s.querySelector('.next .btn');
  bs.forEach((b,i)=>b.onclick=()=>{
    bs.forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    saveAnswer('q'+number, answers[i]);
    r.textContent=reactions[i]||reactions[0];
    beep(450+i*100);
    next.style.display='inline-flex';
  });
  next.onclick=()=>{beep(700);go(nextStep)};
  return s;
}

      saveAnswer('badminton_heart', 'Filled the heart with love');

  hc.onkeydown = e => {if(e.key==='Enter'||e.key===' ')hit()};

}

function rapid(){
  let idx=0;
  const s=render(`<div class="shell"><div class="eyebrow">Rapid-fire round</div><div class="timer">4</div><h1 class="q" id="rq"></h1><div class="answers" id="ra"></div><div class="reaction" id="rr"></div></div>`);
  const q=s.querySelector('#rq'),a=s.querySelector('#ra'),r=s.querySelector('#rr'),timer=s.querySelector('.timer');
  function show(){
    const x=rapidQs[idx];
    q.textContent=x[0];
    a.innerHTML=x[1].map((v,i)=>`<button class="answer" data-i="${i}">${v}</button>`).join('');
    let t=4;
    timer.textContent=t;
    clearInterval(show.t);
    show.t=setInterval(()=>{
      t--;
      timer.textContent=t;
      if(t<=0){
        clearInterval(show.t);
        r.textContent='Venus will pretend that answer was acceptable.'
      }
    },1000);
    a.querySelectorAll('.answer').forEach((b,i)=>b.onclick=()=>{
      clearInterval(show.t);
      saveAnswer('rapid_'+idx, x[1][i]);
      r.textContent=x[2][i];
      beep(520+i*90);
      setTimeout(()=>{
        idx++;
        if(idx<rapidQs.length) show();
        else go(7);
      },800);
    });
  }
  show();
}

function proposal(){
  const s=render(`<div class="shell"><div class="card"><div class="eyebrow">One last question</div><div class="quote">Will you choose me?<br><span class="small">Through the easy days. Through the difficult ones. Through the chaos. Through everything.</span></div><p class="subtitle" style="margin-top:16px;">Will you let Venus stay in your orbit?</p><div class="btns" style="position:relative; min-height:120px; display:flex; justify-content:center; align-items:center; gap:18px; margin-top:24px;"><button class="btn yes" id="yes">YES 💗</button><button class="btn no" id="no">NO 🙈</button></div><p class="reaction" id="nr" style="margin-top:15px; font-weight:800; min-height:1.6em; color:var(--rose)"></p></div></div>`,'proposal');
  
  const no=s.querySelector('#no'),yes=s.querySelector('#yes'),nr=s.querySelector('#nr');
  let dodgeCount=0;
  
  const teases = [
    "Nice try! 😜",
    "The NO button is currently on vacation 🏖️",
    "System Error 404: 'No' option not found 🤖",
    "Are you sure? Try clicking YES instead! ✨",
    "Venus blocked this attempt! 🛡️💖",
    "Nope! Still dodging! 💨",
    "It's physically impossible to click this 🙈",
    "Orbit locking initiated... NO disabled! 🚀",
    "Why are you running away? 🥺",
    "Okay, now you're just playing tag with a button! 🏃‍♀️💨"
  ];

  function dodgeNo(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    dodgeCount++;
    nr.textContent = teases[(dodgeCount - 1) % teases.length];
    
    beep(380 + (dodgeCount % 6) * 70, 0.06);

    no.style.position = 'fixed';
    no.style.zIndex = '999999';
    
    const pad = 24;
    const btnW = no.offsetWidth || 130;
    const btnH = no.offsetHeight || 55;
    
    const maxX = Math.max(pad, window.innerWidth - btnW - (pad * 2));
    const maxY = Math.max(pad, window.innerHeight - btnH - (pad * 2));
    
    let newX = pad + Math.random() * (maxX - pad);
    let newY = pad + Math.random() * (maxY - pad);
    
    no.style.left = newX + 'px';
    no.style.top = newY + 'px';
    no.style.transform = `scale(${Math.max(0.72, 1 - dodgeCount*0.015)}) rotate(${(Math.random()-0.5)*18}deg)`;
  }

  // Never gives up! Dodge on every single interaction:
  ['pointerenter', 'pointerdown', 'mouseenter', 'touchstart', 'click'].forEach(evt => {
    no.addEventListener(evt, dodgeNo, {passive: false});
  });

  // Keyboard accessibility override
  no.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      noEnding();
    }
  });

  yes.onclick = () => yesEnding();
}

          Good. Because I had absolutely no backup plan. 🙈🤍
        </div>
        Through the easy days, through the chaotic ones, through the fights, and through everything life throws at us...<br><br>
        <span style="font-size:1.15em; font-weight:700; color:var(--ink);">
          I promise to keep choosing you. Every single day.
        </span>
      `;
      badge.style.display = 'block';
      confettiHeartsGrand();

      submitAnswersToAndrew('YES').then(result => {
        if(result.ok) showSubmissionStatus(s.querySelector('.card'),'✓ Your YES and all your answers were delivered straight to Andrew! 💌💖','success');
        else showSubmissionStatus(s.querySelector('.card'),'🔒 Choices saved safely on this device.','warning');
      });
    }
  }
  nextLine();
}


// Error recovery
window.addEventListener('error',e=>{
  console.error(e);
  if(!root.innerHTML.trim()) render(`<div class="shell"><div class="card"><div class="eyebrow">Tiny technical wobble</div><h1 class="q">Venus tripped over a cable.</h1><p class="subtitle">The story is still here. Let's restart this moment.</p><div class="btns"><button class="btn" onclick="location.reload()">Restart →</button></div></div></div>`);
});

// App initialization
setProgress(0);
loading();

})();
</script>
</body>
</html>
